name: Validate FilimeHome and build preview APK
on:
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'scripts/android_smoke.py', '.github/workflows/verify-preview.yml']
  push:
    branches: [development/android-filimehome-2]
    paths-ignore: ['docs/**', 'README.md', 'scripts/android_smoke.py', '.github/workflows/verify-preview.yml']
  workflow_dispatch:
concurrency:
  group: filimehome-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-dependency-audit
          path: |
            package-lock.json
            npm-audit.json
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Check browser bundles for private key canaries
        run: |
          GEMINI_API_KEY=filimehome-private-gemini-canary TMDB_API_KEY=filimehome-private-tmdb-canary npm run build
          if grep -R -E 'filimehome-private-(gemini|tmdb)-canary' dist/assets; then exit 1; fi
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npx expo install --check
        working-directory: mobile
      - run: npm run export:android --prefix mobile
      - run: npx expo prebuild --platform android --non-interactive
        working-directory: mobile
      - name: Compile standalone preview APK using generated debug signing
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: filimehome-preview-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Install APK and verify startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python3 scripts/android_smoke.py mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-evidence
          path: |
            android-startup.log
            android-activities.log
            android-ui.xml
            filimehome-startup.png
