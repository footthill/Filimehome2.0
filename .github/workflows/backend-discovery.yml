name: Inspect existing public movie backend
on:
  push:
    branches: [development/android-filimehome-2]
    paths: ['scripts/audit_live_backend.py', '.github/workflows/backend-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect deployed website and public REST access without database writes
        run: python3 scripts/audit_live_backend.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-backend-public-audit
          path: backend-audit/
          if-no-files-found: error
