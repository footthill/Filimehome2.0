name: Phase 1 playback safety checks (no APK)
on:
  push:
    branches: [repair/phase1-playback-audit]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck --prefix mobile
      - run: npm run build
      - name: Inspect live website playback code and movie field shapes without media requests
        run: python3 scripts/audit_playback.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-playback-readonly-evidence
          path: playback-audit/
          if-no-files-found: warn
